[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swot-raqw"
version = "0.1.0"
description = "Reach-adaptive quantile-window filtering of SWOT PIXC river slopes"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
  {name = "TJ Wilkerson"},
]
keywords = ["SWOT", "PIXC", "river slope", "quantile regression", "hydrology"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
  "earthaccess>=0.18",
  "geopandas>=1.0",
  "matplotlib>=3.8",
  "netCDF4>=1.7",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyproj>=3.6",
  "requests>=2.31",
  "scipy>=1.13",
  "shapely>=2.0",
  "statsmodels>=0.14",
]

[project.urls]
Homepage = "https://github.com/tjwilkerson/swot-raqw"
Repository = "https://github.com/tjwilkerson/swot-raqw"
Issues = "https://github.com/tjwilkerson/swot-raqw/issues"

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-cov>=5",
]
gui = [
  "streamlit>=1.39",
  "pydeck>=0.9",
]

[project.scripts]
raqw = "raqw.cli:main"
raqw-batch = "raqw.batch:main"
raqw-gui = "raqw.gui:launch"

[tool.setuptools.packages.find]
include = ["raqw*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
